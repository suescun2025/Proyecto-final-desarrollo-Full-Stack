{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMatch - Tienda Inteligente de Accesorios Premium</title>
    
    <!-- Google Fonts: Outfit, Space Grotesk, Mona Sans, and Calligraphy Script Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Mona+Sans:wght@300;400;500;600;700&family=Rubik+Glitch&family=Kaushan+Script&family=Alex+Brush&family=Great+Vibes&family=MonteCarlo&family=Satisfy&family=Caveat:wght@600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    
    <!-- Archivo de estilos de React -->
    <link rel="stylesheet" href="{% static 'assets/index.css' %}?v=112">
</head>
<body>

    <!-- Contenedor Único para la Aplicación React (SPA) -->
    <div id="root"></div>

    <!-- Configuración de Sesión y CSRF de Django a React -->
    <script>
        window.isAuthenticated = {{ request.user.is_authenticated|yesno:"true,false" }};
        window.isStaff = {{ request.user.is_staff|yesno:"true,false" }};
        window.csrfToken = "{{ csrf_token }}";
        window.username = "{{ request.user.username|escapejs }}";
    </script>
    
    <!-- Código compilado de la App React -->
    <script type="module" src="{% static 'assets/index.js' %}?v=112"></script>










</body>
</html>
